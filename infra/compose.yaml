
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chatbot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: chatbot_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
